<!-- 네비게이션바 -->
{% load static %}
<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
  <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'qna:index' %}">🇶 🇳 🇦</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="{% url 'qna:index' %}">Home</a>
          </li>
          <li class="nav-item">
              <a class="nav-link" href="#">About</a>
          </li>
        </ul>
        <!-- https://docs.djangoproject.com/ko/6.0/ref/contrib/auth/ -->
        <ul class="navbar-nav mb-2 mb-lg-0">
          {# user 객체(django.contrib.auth) 를 선언 없이 사용할 수 있다. #}
          {% if user.is_authenticated %}
            <li class="nav-item">
              <a clss="nav-link" href="#" title="{{ user.username }}">
                {% if user.userdetail.profile %}
                <img src="{{ user.userdetail.profile.url }}" class="rounded-circle" width="28" alt="프로필사진">
                {% else %}
                <img src="/media/profile/default.jpg" class="rounded-circle" width="28" alt="기본사진">
                {% endif %}
              </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'uauth:logout' %}">로그아웃</a>
            </li>
          {% else %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'uauth:login' %}">로그인</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'uauth:signup' %}">회원가입</a>
            </li>
          {% endif %}
        </ul>
      </div>
  </div>
</nav>
